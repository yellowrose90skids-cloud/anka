name: Build ANKA APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        run: |
          cp lib/main.dart /tmp/main.dart
          rm -rf android
          flutter create --org com.anka --project-name anka --platforms android .
          cp /tmp/main.dart lib/main.dart
          flutter pub add http image_picker shared_preferences
          flutter pub add dev:flutter_launcher_icons
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/logo.png
            adaptive_icon_background: "#4B34C9"
            adaptive_icon_foreground: assets/logo_fg.png
          EOF
          dart run flutter_launcher_icons
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="ANKA"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ANKA-apk
          path: build/app/outputs/flutter-apk/app-release.apk
